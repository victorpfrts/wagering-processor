name: wagering

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 2s
      retries: 30

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Roda uma vez antes das réplicas: evita três instâncias migrando ao mesmo tempo.
  migrate:
    build: .
    profiles: ["app"]
    command: ["bun", "src/infrastructure/db/migrate.ts", "up"]
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    profiles: ["app"]
    deploy:
      replicas: 3
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PORT: "3000"
    ports:
      - "3000-3002:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    stop_grace_period: 30s
